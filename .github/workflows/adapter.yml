name: Rust-adapter

on:
  push:
    branches: [ "zipline" ]
    paths:
      - 'adapter/ph/**'
      - 'adapter/cli/**'
      - 'zpr-ext/**'
      - 'cslab/**'
      - 'cbpf-rs/**'
      - 'libnode2/**'
      - 'integration-test/**'
      - 'zpr/**'
      - '.github/workflows/adapter.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'adapter/ph/**'
      - 'adapter/cli/**'
      - 'zpr-ext/**'
      - 'cslab/**'
      - 'cbpf-rs/**'
      - 'libnode2/**'
      - 'integration-test/**'
      - 'zpr/**'
      - '.github/workflows/adapter.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  VISA_SERVICE_RELEASE: v0.21.1

jobs:
  # Build and upload ph
  # Windows support (zipline#132): ph's default feature set builds on Windows —
  # io-uring is a Linux-target-gated dependency, so defaults are portable
  # (verified by the msvc cross-check quoted in the PR). Windows is a separate
  # job call (build-ph-windows below) only because Cargo emits ph.exe there and
  # the reusable workflow uses an explicit package-path verbatim — a single job
  # call cannot vary the path per matrix OS.
  build-ph:
    name: PH
    uses: org-zpr/zl-zpr-dev-tools/.github/workflows/rust-build-test.yml@v1.5
    with:
      name: 'ph'
      path: './adapter/ph'
      package: true
      package-path: './target/debug/ph'
      runs-on: "['ubuntu-latest', 'macos-latest']"
      needs-capnp: true
    secrets: inherit

  # Build and upload ph on Windows (zipline#132): identical to build-ph except
  # runs-on and the .exe suffix on package-path. See the comment above.
  build-ph-windows:
    name: PH
    uses: org-zpr/zl-zpr-dev-tools/.github/workflows/rust-build-test.yml@v1.5
    with:
      name: 'ph'
      path: './adapter/ph'
      package: true
      package-path: './target/debug/ph.exe'
      runs-on: "['windows-latest']"
      needs-capnp: true
    secrets: inherit

  # Build and upload ph-cli
  build-ph-cli:
    name: PH CLI
    uses: org-zpr/zl-zpr-dev-tools/.github/workflows/rust-build-test.yml@v1.5
    with:
      name: 'ph-cli'
      path: './adapter/cli'
      package: true
      package-path: './target/debug/ph-cli'
      runs-on: "['ubuntu-latest']"
      needs-libpcap: true
      needs-capnp: true
    secrets: inherit

  # Build and upload ph-cli on Windows (zipline#132). Separate job call so the
  # Linux job above stays byte-identical: on Windows the pcap default feature
  # is off (--no-default-features, plan D13) and libpcap is not installed.
  build-ph-cli-windows:
    name: PH CLI
    uses: org-zpr/zl-zpr-dev-tools/.github/workflows/rust-build-test.yml@v1.5
    with:
      name: 'ph-cli'
      path: './adapter/cli'
      package: true
      package-path: './target/debug/ph-cli.exe'
      runs-on: "['windows-latest']"
      needs-capnp: true
      no-default-features: true
    secrets: inherit

  # Test ph, check for warnings, and check formatting
  test-ph:
    name: PH
    needs: [build-ph, build-ph-windows]
    uses: org-zpr/zl-zpr-dev-tools/.github/workflows/rust-test.yml@v1.5
    with:
      name: 'ph'
      path: './adapter/ph'
      runs-on: "['ubuntu-latest', 'macos-latest', 'windows-latest']"
      needs-capnp: true
    secrets: inherit

  # Test ph-cli, check for warnings, and check formatting
  test-ph-cli:
    name: PH CLI
    needs: [build-ph-cli]
    uses: org-zpr/zl-zpr-dev-tools/.github/workflows/rust-test.yml@v1.5
    with:
      name: 'ph-cli'
      path: './adapter/cli'
      runs-on: "['ubuntu-latest']"
      needs-libpcap: true
      needs-capnp: true
    secrets: inherit

  # Test ph-cli on Windows (zipline#132); pairs with build-ph-cli-windows.
  test-ph-cli-windows:
    name: PH CLI
    needs: [build-ph-cli-windows]
    uses: org-zpr/zl-zpr-dev-tools/.github/workflows/rust-test.yml@v1.5
    with:
      name: 'ph-cli'
      path: './adapter/cli'
      runs-on: "['windows-latest']"
      needs-capnp: true
      no-default-features: true
    secrets: inherit

  # Integration tests (zl-zipline#210)
  #
  # CI runs the same set of scripts as the local netns tier
  # (`zpr-dev build --test netns`): every top-level
  # integration-test/*-test.sh. The list is taken from that glob rather than
  # written out here, so a new script runs in CI without a workflow change.
  # zpr-dev's drift guard (tiers.rs, NETNS_SCRIPTS) uses the same glob.

  # List the integration scripts, and run the helper-library self-check,
  # which needs no built binaries.
  list-integration-tests:
    name: List integration tests
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.list.outputs.scripts }}
    steps:
    - uses: actions/checkout@v7

    - name: Allow unprivileged user namespaces
      # common_funcs_check.sh uses `unshare -r`, like the tests themselves;
      # Ubuntu 24.04's AppArmor restriction would block that.
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Check common_funcs.sh
      timeout-minutes: 5
      run: integration-test/common_funcs_check.sh

    - name: List *-test.sh scripts
      id: list
      run: |
        # Fail closed: an empty matrix would report green with nothing run.
        shopt -s nullglob
        scripts=(integration-test/*-test.sh)
        if [ ${#scripts[@]} -eq 0 ]; then
          echo "no integration-test/*-test.sh scripts found" >&2
          exit 1
        fi
        json=$(printf '%s\n' "${scripts[@]##*/}" | jq -R . | jq -sc .)
        echo "scripts=$json" >> "$GITHUB_OUTPUT"
        echo "$json"

  # Run each integration script on its own runner, against the ph and ph-cli
  # built above and the visa service release named by VISA_SERVICE_RELEASE.
  integration-test:
    name: Integration (${{ matrix.script }})
    needs: [build-ph, build-ph-cli, list-integration-tests]
    strategy:
      # One failing script must not cancel the others: report every failure.
      fail-fast: false
      matrix:
        script: ${{ fromJSON(needs.list-integration-tests.outputs.scripts) }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    # see <https://github.com/docker-library/golang/issues/452>
    - name: Set workspace as safe
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Git credentials
      timeout-minutes: 1
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"
        go env -w GOPRIVATE="github.com/org-zpr/*"

    - uses: actions/download-artifact@v8
      with:
        pattern: ph-*ubuntu-latest
        merge-multiple: true

    - name: Build
      timeout-minutes: 10
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        tar -xvf ph.tar
        tar -xvf ph-cli.tar

    # a2a-pubkey-test.sh starts its node with
    # --security-testing-mangle-forwarded-pings, which only an
    # enable-security-testing build of ph accepts (zpr-dev's netns tier makes
    # the same prep build). It overwrites target/debug/ph on this runner
    # only; the uploaded ph artifact is never a security-testing build.
    - name: Build security-testing ph
      if: matrix.script == 'a2a-pubkey-test.sh'
      timeout-minutes: 20
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        sudo apt-get install -y capnproto
        cargo build -p ph --features enable-security-testing

    # The release carries vs, vs-admin and zpr-attr-server; extracting it into
    # integration-test/ puts them where the scripts' default *_BIN paths look.
    - name: Download Asset
      uses: robinraju/release-downloader@v1
      with:
        repository: 'org-zpr/zl-zpr-visaservice'
        tag: ${{ env.VISA_SERVICE_RELEASE }}
        fileName: 'release-linux-x86_64.tar.gz'
        extract: true
        out-file-path: 'integration-test'
        token: ${{ secrets.ZPR_CICD_RO_TOKEN }}

    - name: Set env
      run: |
        echo "DEBUG_TARGETS=all=DEBUG" >> $GITHUB_ENV

    - name: Install valkey
      timeout-minutes: 5
      run: |
        sudo apt-get update
        sudo apt install -y valkey
        sudo systemctl stop valkey-server
        sudo systemctl disable valkey-server

    - name: Allow unprivileged user namespaces
      # The integration tests run inside `unshare -nr` instead of sudo;
      # Ubuntu 24.04's AppArmor restriction would block that.
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Run ${{ matrix.script }}
      # One limit for every script: the longest (OIDC renewal, policy
      # reauth) needed 25 minutes as separate jobs.
      timeout-minutes: 25
      run: |
        ZPR_TEST_VERBOSE=1 VALKEY_SERVER_BIN=/usr/bin/valkey-server integration-test/${{ matrix.script }}
