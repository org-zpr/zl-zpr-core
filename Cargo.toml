# zpr-core
[workspace]
resolver = "3"
members = ["adapter/admin-api", "adapter/ph", "adapter/cli", "libnode2", "fuzz", "build-info"]

[workspace.package]
version = "0.7.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98.1"

[workspace.dependencies]
aws-lc-rs = "1.17"
capnp = { version = "0.27.3", features = ["sync_reader"] }
capnp-rpc = "0.27.3"
cbpf-rs = { git = "https://github.com/org-zpr/zl-zpr-utils.git", tag = "cbpf-rs-v0.2.0" }
clap = { version = "4.5.23", features = ["derive"] }
clap_complete = "4.5.57"
ip4sum = "0.1.0"
ipnet = "2.11.0"
pcap = "2.0.0"
strum = { version = "0.27.1", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["rt", "compat"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
x509-cert = "0.3.0"
zpr = { git = "https://github.com/org-zpr/zl-zpr-common.git", tag = "zl-v0.32.0-zodes.5", features = ["vsapi", "policy"] }
zpr-ext = { git = "https://github.com/org-zpr/zl-zpr-utils.git", tag = "zpr-ext-v0.6.1" }
zpr-utils = { git = "https://github.com/org-zpr/zl-zpr-utils.git", tag = "zpr-utils-v0.2.3" }

[profile.release]
panic = "abort"

# Mainline crates.io Cap'n Proto only; no capnproto-rust fork.
#
# Packet capture to a file (`ph-cli capture ...`) used to need the
# FD-passing fork (emilazy's capnproto-rust PR #666, carried as
# mkolehmainen/capnproto-rust). It is compiled out of normal builds so that
# fork is no longer a dependency. The capture code is still in the tree, gated
# on cfg(all(unix, feature = "capnp-ancillary")). For a debug build that needs
# capture, revert the commit that removed the fork: it restores this file's
# [patch.crates-io] block, the `capnp-futures` workspace dependency, and the
# `capnp-ancillary` feature in adapter/ph and adapter/cli.
