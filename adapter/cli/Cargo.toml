[package]
name = "ph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
build-info = { path = "../../build-info" }
admin-api = { path = "../admin-api" }
capnp = { workspace = true }
capnp-rpc = { workspace = true }
cbpf-rs = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true, optional = true }
ctrlc = { version = "3.4.4" }
pcap = { workspace = true, optional = true }
shlex = { version = "1.3.0" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
zpr-ext = { workspace = true, features = ["bytes", "tokio", "zerocopy"] }
rustyline = { version = "17.0.2", features = ["derive"] }
dirs = "6.0.0"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.13", features = ["json", "form", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"

[features]
default = ["pcap"]
pcap = ["dep:pcap", "cbpf-rs/pcap"]
complete = ["clap_complete"]

[[bin]]
name = "ph-cli"
path = "src/main.rs"

[[bin]]
name = "generate_completions"
path = "src/generate_completions.rs"
required-features = ["complete"]

[lints.rust]
# The `capnp-ancillary` feature (FD-passing packet capture) is not declared:
# it needs the capnproto-rust fork, which normal builds no longer use (see the
# root Cargo.toml). check-cfg keeps its cfg gates a known value, so the
# compiled-out capture code does not warn.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"capnp-ancillary\"))"] }
