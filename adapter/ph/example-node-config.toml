# Example of a Zode configuration file: `ph zode -c <this file>`.
# Unknown sections and keys are refused.

# ============================================================================
# GLOBAL section
# ============================================================================
[global]

    # ------------------------------------------------------------------------
    # control_path
    #
    # [optional] - Pathname of the unix domain socket used by the
    #              debug packet capture system. Defaults to
    #              "control.sock" in the default local files dir.
    # ------------------------------------------------------------------------
# control_path = "/var/run/zpr/control.sock"

    # ------------------------------------------------------------------------
    # self_addr
    #
    # [optional] - The substrate address and port this Zode's peers dial.
    #              Defaults to "0.0.0.0:0"; port 0 becomes the default
    #              tether port.
    # ------------------------------------------------------------------------
# self_addr = "192.168.0.1:12345"

    # ------------------------------------------------------------------------
    # zpr_addr
    #
    # [required] - The Zode's ZPR addresses. The first is its own address,
    #              an IPv6 address: the VS-API session to vs.zpr leaves
    #              from it. A relay lists fd5a:5052::1 (vs.zpr) after it.
    # ------------------------------------------------------------------------
zpr_addr = [ "fd5a:5052::2" ]

    # ------------------------------------------------------------------------
    # ca_file
    #
    # [required] - Path to PEM certficate for the certificate authority.
    # ------------------------------------------------------------------------
ca_file = "tests/ca.pem"

    # ------------------------------------------------------------------------
    # certificate_file
    #
    # [required] - Path to PEM certificate holding the noise
    #              public key signed by the certificate
    #              authority.
    # ------------------------------------------------------------------------
certificate_file = "tests/certificate.pem"

    # ------------------------------------------------------------------------
    # private_key_file
    #
    # [required] - Path to PEM file containing the noise private
    #              key for this node.
    # ------------------------------------------------------------------------
private_key_file = "tests/private_key.pem"

    # ------------------------------------------------------------------------
    # tun_if
    #
    # [optional] - Explicity name the TUN interface to use. If not
    #              specified then the kernel picks a free one.
    # ------------------------------------------------------------------------
# tun_if = "tun23"

# ============================================================================
# NODE section
# ============================================================================
[node]

    # ------------------------------------------------------------------------
    # relay / initial_link
    #
    # [required] - Exactly one of them. A relay (relay = true) never dials;
    #              any other Zode dials its relay over its initial link.
    # ------------------------------------------------------------------------
# relay = true
initial_link = { addr = "192.168.0.1:5000", cn = "relay.zpr" }

